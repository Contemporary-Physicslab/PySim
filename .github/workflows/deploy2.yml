# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Build HTML (JB2) into subpath
        run: |
          # Check out JB2 branch into a separate folder
          git worktree add ../_JB2_build JB2
      
          # Build JB2 with BASE_URL pointing to /<repo>/JB2
          cd ../_JB2_build
          BASE_URL=/${{ github.event.repository.name }}/JB2 myst build --execute --html
      
          # Copy JB2 site into main site's build folder under /JB2
          cd -
          rm -rf _build/html/JB2
          mkdir -p _build/html/JB2
          cp -a ../_JB2_build/_build/html/. _build/html/JB2/
      
          # Clean up worktree
          git worktree remove ../_JB2_build --force


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

